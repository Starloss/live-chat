name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: live_chat
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d live_chat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/live_chat
      JWT_SECRET: ci-jwt-secret
      PORT: 4000
      WEB_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @live-chat/api prisma:generate

      - name: Run Prisma migrations
        run: pnpm --filter @live-chat/api prisma:migrate --name ci --skip-generate

      - name: Typecheck
        run: pnpm typecheck

      - name: API tests
        run: pnpm test:api

services:
  db:
    image: postgres:17-alpine
    container_name: live-chat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: live_chat
    ports:
      - "5433:5432"
    volumes:
      - live_chat_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d live_chat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  live_chat_db_data:
